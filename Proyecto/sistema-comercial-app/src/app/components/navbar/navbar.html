<nav class="navbar navbar-expand-lg app-navbar border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/laboratorio">Sistema Comercial</a>

    <div class="d-flex align-items-center gap-3 ms-auto">
      <ul class="navbar-nav flex-row align-items-center gap-3 mb-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/laboratorio"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Laboratorio
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/cargos"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Cargos
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/empleados"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Empleados
          </a>
        </li>
      </ul>

      @if (isAuthenticated()) {
        <button type="button" class="btn btn-outline-primary rounded-pill px-4" (click)="logout()">
          Cerrar sesion
        </button>
      } @else {
        <button type="button" class="btn btn-primary rounded-pill px-4" (click)="goToLogin()">
          Iniciar sesion
        </button>
      }
    </div>
  </div>
</nav>
